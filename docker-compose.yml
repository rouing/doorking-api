# DoorKing Gate Manager + PostgreSQL 18
#
# Quick start:
#   1. Create a .env file next to this file (mode 600):
#        POSTGRES_PASSWORD=<long-random-password>
#        PUBLIC_HOST=gate.example.com        # optional: your HTTPS reverse-proxy hostname
#        TZ=America/Chicago                  # your local time zone (schedules & cameras)
#   2. Start:
#        docker compose up -d --build
#   3. Read the first-account setup code from the logs:
#        docker compose logs app
#   4. Open http://localhost:8080 (or https://$PUBLIC_HOST behind Caddy/NGINX; see docs/config/).
#
# For SMTP email, SSO providers, or custom gateDefaults, place a config.json (mode 600, owned
# by UID 1000) in the doorking-data volume at /data/config.json and uncomment DOORKING_CONFIG.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: doorking
      POSTGRES_USER: doorking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorking -d doorking"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Bound to loopback on the host; put Caddy or NGINX in front for public HTTPS (see docs/config/).
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    # Matches the server's 5-minute shutdown wait so an active gate pull/send finishes cleanly.
    stop_grace_period: 330s
    environment:
      DATABASE_URL: postgres://doorking:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/doorking
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      TZ: ${TZ:-UTC}
      TRUST_PROXY: "true"
      # Optional: mount or place a config.json (chmod 600, uid 1000) for SMTP email or SSO providers:
      # DOORKING_CONFIG: /data/config.json
    volumes:
      - doorking-data:/data

volumes:
  pgdata:
  doorking-data:
