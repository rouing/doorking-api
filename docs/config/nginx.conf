# Sample NGINX configuration for DoorKing Gate Manager
#
# Replace gate.example.com and the TLS certificate paths (e.g. from certbot / Let's Encrypt).
# Set "publicHost": "gate.example.com" in config.json (or PUBLIC_HOST=gate.example.com in Docker).
#
# Copy to /etc/nginx/sites-available/doorking.conf, symlink into sites-enabled, test and reload:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name gate.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gate.example.com;

    ssl_certificate     /etc/letsencrypt/live/gate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gate.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # HSTS belongs at the TLS proxy; the app (@fastify/helmet) already sends CSP, X-Frame-Options,
    # X-Content-Type-Options and Referrer-Policy (same-origin).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Match the app's JSON body limit (10 KB) with comfortable headroom
    client_max_body_size 1m;

    # Use 127.0.0.1:8080 when NGINX runs on the host (bare-metal or Docker Compose),
    # or app:8080 if NGINX runs as a container on the same Docker network.

    # Live camera MJPEG stream: disable buffering and allow up to the app's 15-minute live cap.
    location ~ ^/api/gates/[^/]+/cameras/live/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 960s;
    }

    # Saved camera pictures and MP4 videos (preserves Range requests for video seeking).
    location ~ ^/api/gates/[^/]+/snapshots/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
